# Ruff (linter) settings for the backend, used by scripts/check_all.ps1.
# Install it with: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
target-version = "py312"
extend-exclude = ["*/migrations/*"]  # generated by Django

[lint]
# Real errors only:
#   F          pyflakes: undefined names, unused imports and variables...
#   E4 E7 E9   pycodestyle errors: imports, statements, syntax
#   B          flake8-bugbear: common bug patterns
# Not enabled for now: import sorting (I) would rewrite many files, and RUF012
# flags normal Django class attributes (list_display, Meta.indexes...).
select = ["F", "E4", "E7", "E9", "B"]
